name: Benchmark validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m motionbench validate
      - run: python -m unittest discover -s tests -v
      - run: python -m motionbench plan --split development --repeats 1 --out runs/ci
      - run: python -m motionbench summarize --run runs/ci
